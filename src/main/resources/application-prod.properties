spring.application.name=PulseChat
server.port=${PORT:8080}

# ==============================================================================
# Production Database Configuration (PostgreSQL / MySQL)
# ==============================================================================
# Default is configured for PostgreSQL in Docker / Cloud.
# To switch to MySQL, override DB_URL, DB_USERNAME, DB_PASSWORD, and DB_DRIVER.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsechatdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# HikariCP Production Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=PulseChatHikariPool

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.chatapp.chatapplication=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
