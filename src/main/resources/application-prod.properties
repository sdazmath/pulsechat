spring.application.name=PulseChat
server.port=${PORT:8080}

# ==============================================================================
# Production Database Configuration (PostgreSQL / MySQL / Embedded H2 Fallback)
# ==============================================================================
# If external DB_URL is configured (e.g. Render PostgreSQL, Supabase, Neon),
# PulseChat connects to PostgreSQL/MySQL. If not set, it defaults seamlessly to
# embedded persistent H2 storage (./data/chatdb) so cloud deployment succeeds out-of-the-box!
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/chatdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# HikariCP Production Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=PulseChatHikariPool

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.chatapp.chatapplication=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
