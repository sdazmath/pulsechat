services:
  # PulseChat Spring Boot Web Application
  pulsechat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsechat-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/pulsechatdb
      - DB_USERNAME=postgres
      - DB_PASSWORD=pulse_secret_password_here
      - DB_DRIVER=org.postgresql.Driver
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulsechat-net

  # Production PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pulsechat-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pulsechatdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pulse_secret_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsechatdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsechat-net

networks:
  pulsechat-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
